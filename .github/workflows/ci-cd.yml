name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.9'
  TORCH_VERSION: '2.0.0'

jobs:
  # Code quality checks
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort mypy

      - name: Run black
        run: black src/ tests/ scripts/ --check

      - name: Run isort
        run: isort src/ tests/ scripts/ --check-only

      - name: Run flake8
        run: flake8 src/ tests/ scripts/

      - name: Run mypy
        run: mypy src/

  # Unit tests
  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.9, '3.10']
        torch-version: ['2.0.0', '2.1.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyTorch with CPU support
        run: |
          pip install torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Install additional test dependencies
        run: |
          pip install pytest pytest-cov hypothesis

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # Experiments and benchmarks
  experiments:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install transformers datasets accelerate scipy

      - name: Run baseline experiments
        run: |
          timeout 3600 python scripts/experiments.py --mode baseline --model gpt2 --dataset wikitext-2 --calibration-size 500

      - name: Run ablation studies
        run: |
          timeout 3600 python scripts/experiments.py --mode calibration --model gpt2 --dataset wikitext-2

      - name: Run parameter optimization
        run: |
          timeout 3600 python scripts/experiments.py --mode parameter --model gpt2 --dataset wikitext-2

      - name: Collect and process results
        run: |
          python scripts/collect_results.py
          python scripts/generate_results_summary.py

      - name: Upload results artifacts
        uses: actions/upload-artifact@v3
        with:
          name: experiment-results
          path: results/
          retention-days: 30

      - name: Generate visualizations
        run: |
          python scripts/visualize_results.py

      - name: Upload visualizations
        uses: actions/upload-artifact@v3
        with:
          name: experiment-visualizations
          path: plots/
          retention-days: 30

  # Documentation and report generation
  documentation:
    needs: experiments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jupyter nbconvert pandas

      - name: Generate technical report
        run: |
          python scripts/generate_technical_report.py

      - name: Build documentation
        run: |
          mkdocs build --clean

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v3
        with:
          name: documentation
          path: site/
          retention-days: 30

  # Performance benchmarks on different platforms
  benchmark:
    needs: experiments
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment (${{ matrix.platform }})
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run benchmarks
        run: |
          python scripts/run_benchmarks.py --platform ${{ matrix.platform }}

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results-${{ matrix.platform }}
          path: benchmarks/
          retention-days: 30

  # Package distribution
  package:
    needs: [lint, test, experiments, documentation, benchmark]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Python package
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install twine
          twine upload dist/*

  # Results aggregation and reporting
  results-summary:
    needs: package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: all-artifacts

      - name: Aggregate results
        run: |
          python scripts/aggregate_results.py
          python scripts/generate_final_report.py

      - name: Create release notes
        run: |
          python scripts/create_release_notes.py

      - name: Commit and push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add results/ documentation/ benchmarks/
          git commit -m "Add experiment results and documentation"
          git push

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.run_number }}
          release_name: "Release ${{ github.run_number }}"
          body_path: "RELEASE_NOTES.md"
          draft: false
          prerelease: false